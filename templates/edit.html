<!-- templates/edit.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>
    <!-- CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card shadow-sm">
                    <div class="card-header bg-warning text-dark">
                        <h4 class="card-title mb-0">Edit Data Employee</h4>
                    </div>
                    <div class="card-body">
                        <form action="/employees/edit/{{ employee.id }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Nama</label>
                                <input type="text" name="name" class="form-control" value="{{ employee.name }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Posisi</label>
                                <input type="text" name="position" class="form-control" value="{{ employee.position }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Gaji (Rp)</label>
                                <input type="number" name="salary" class="form-control" value="{{ employee.salary }}">
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <a href="/employees/new" class="btn btn-secondary">Batal</a>
                                <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
