<!-- templates/form.html -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Pegawai</title>
    <!-- CSS Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10">
                
                <!-- Card Form Input -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h4 class="card-title mb-0">Tambah Employee Baru</h4>
                    </div>
                    <div class="card-body">
                        <form action="/employees/new" method="POST">
                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Nama</label>
                                    <input type="text" name="name" class="form-control" placeholder="Masukkan nama" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Posisi</label>
                                    <input type="text" name="position" class="form-control" placeholder="Contoh: Manager">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label font-weight-bold">Gaji (Rp)</label>
                                    <input type="number" name="salary" class="form-control" placeholder="0">
                                </div>
                            </div>
                            <div class="mt-3 text-end">
                                <button type="submit" class="btn btn-success px-4">Simpan Data</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Card Tabel Data -->
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h4 class="card-title mb-0">Daftar Employee</h4>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-striped align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nama</th>
                                        <th>Posisi</th>
                                        <th>Gaji</th>
                                        <th class="text-center">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for e in employees %}
                                    <tr>
                                        <td><span class="badge bg-secondary">#{{ e.id }}</span></td>
                                        <td class="fw-bold">{{ e.name }}</td>
                                        <td>{{ e.position }}</td>
                                        <td class="text-success fw-bold">Rp{{ "{:,}".format(e.salary) }}</td>
                                        <td class="text-center">
                                            <a href="/employees/edit/{{ e.id }}" class="btn btn-warning btn-sm me-1">Edit</a>
                                            <form action="/employees/delete/{{ e.id }}" method="POST" style="display:inline;">
                                                <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Yakin ingin menghapus pegawai ini?')">Hapus</button>
                                            </form>
                                        </td>
                                    </tr>
                                    {% else %}
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-4">Belum ada data pegawai.</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
